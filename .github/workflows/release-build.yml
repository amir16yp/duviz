name: Release build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/duviz dist/duviz-linux-x86_64
          chmod +x dist/duviz-linux-x86_64
          (cd dist && sha256sum duviz-linux-x86_64 > duviz-linux-x86_64.sha256)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: duviz-linux-x86_64
          path: |
            dist/duviz-linux-x86_64
            dist/duviz-linux-x86_64.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/duviz-linux-x86_64
            dist/duviz-linux-x86_64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
