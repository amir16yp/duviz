name: Format

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the auto-commit can push back to the PR branch / default branch.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit and push formatting
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: cargo fmt"
          file_pattern: "*.rs"
        # Avoid infinite loops / noisy commits on forks without write access.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
