[package]
name = "duviz"
version = "0.1.0"
edition = "2021"
description = "WizTree-style disk usage visualizer for the Linux terminal"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"

[profile.release]
opt-level = 3
lto = true
